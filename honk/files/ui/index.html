<main>
<h1>Doona 面板资源缺失</h1>
<p>Honk 核心已经启动，但它找不到 Doona 面板的静态资源，因此无法提供完整的 Web 界面。</p>
<p>面板资源随 <code>honk</code> 包一起安装。重新安装该包即可恢复：</p>
<p><code>apk add --force-reinstall honk</code></p>
<p>LuCI 运维界面（服务 → Honk）不受影响，代理功能也照常工作。</p>
</main>
</body>
