name: Check honk/doona upstream

# Scheduled runs pin changed upstream commits and dispatch the full package
# matrix; only a successful candidate is promoted to main and formal feeds.

on:
  schedule:
    # 00:00 UTC is 08:00 in Asia/Shanghai. Upstream's daily commit activity
    # sits between roughly 12:00Z and 22:00Z, so this slot collects the whole
    # day's changes in one run instead of testing a mid-flight state, and it
    # also leaves two hours of margin before the next day's activity starts.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-bump-honk
  cancel-in-progress: false

env:
  STAGING: auto-bump-staging-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect upstream release changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ci/pins.env

          require_sha() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$2 is not a full 40-character commit SHA: ${1:-<empty>}"
              exit 1
            fi
          }

          # Doona publishes tagged releases, so the release tag is the trigger
          # there: it is immutable, so an unchanged tag means nothing new.
          latest_release_tag() {
            local repo=$1 filter=${2:-} tag
            for tag in $(gh api "repos/$repo/releases?per_page=100" --jq '.[].tag_name'); do
              if [ -n "$filter" ] && ! printf '%s' "$tag" | grep -qE "$filter"; then
                continue
              fi
              printf '%s\n' "$tag"
              return 0
            done
            return 1
          }

          # The honk core is tracked by the upstream main branch head instead of
          # a release tag. Upstream publishes dated debug tags only when
          # somebody pushes one by hand, which is far less often than the
          # upstream branch itself moves, so a tag-gated check would leave the
          # package many commits behind.
          #
          # A branch head carries no "this exact commit was published"
          # guarantee, so the upstream CI is the gate instead: only a commit
          # whose own check runs are all green is accepted. Upstream runs its
          # full lane set on every push to main, so the required lanes below
          # are the ones that decide whether a commit is usable.
          #
          # The legacy commit status API reports "pending" with no entries for
          # these commits, so the check runs API is the only usable source.
          # A re-run of a lane produces a second entry under the same name;
          # the highest id is the current verdict for that lane.
          REQUIRED_LANES='changes|docs|fmt + clippy|cargo nextest (workspace)|cargo nextest (aarch64)|DNS smoke (release honk-core)|dae-config parser (conformance + fuzz replay)|eBPF feature compile guard|eBPF object + real VM kernel tests|eBPF real VM tests (recent kernel)|Independent feature sets|x86_64 musl release path'

          lane_verdict() {
            local repo=$1 sha=$2
            gh api "repos/$repo/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | "\(.id)\t\(.name)\t\(.status)\t\(.conclusion)"' 2>/dev/null ||
              printf ''
          }

          # Prints the commit when every required lane completed successfully.
          # Anything else (a lane still running, a lane failed, a lane missing)
          # means the commit is not proven yet.
          #
          # The verdict per lane is kept in a temporary file rather than a
          # bash associative array, so the same script also runs on bash 3.2.
          # A re-run of a lane produces a second entry under the same name;
          # the highest check run id is the current verdict for that lane.
          is_green() {
            local repo=$1 sha=$2 id name status conclusion lane
            local seen
            seen="$(mktemp)"
            while IFS=$'\t' read -r id name status conclusion; do
              [ -n "$name" ] || continue
              printf '%s\t%s\t%s\n' "$name" "$id" "$status $conclusion" >> "$seen"
            done < <(lane_verdict "$repo" "$sha")
            local ok=0
            while IFS= read -r lane; do
              [ -n "$lane" ] || continue
              local verdict
              verdict=$(awk -F'\t' -v lane="$lane" '
                $1 == lane && $2 > best { best = $2; v = $3 }
                END { print v }
              ' "$seen")
              if [ "$verdict" != "completed success" ]; then
                echo "    lane '${lane}': ${verdict:-<missing>}" >&2
                ok=1
              fi
            done < <(printf '%s' "$REQUIRED_LANES" | tr '|' '\n')
            rm -f "$seen"
            return "$ok"
          }

          # Walk back from the branch head until a proven-good commit is
          # found. The head itself is the usual answer; the walk-back only
          # matters while upstream's newest commit is still being tested.
          latest_green_commit() {
            local repo=$1 branch=$2 sha
            for sha in $(gh api "repos/$repo/commits?sha=$branch&per_page=10" --jq '.[].sha'); do
              # Diagnostics go to stderr: stdout carries the commit alone.
              echo "  checking $sha" >&2
              if is_green "$repo" "$sha"; then
                printf '%s\n' "$sha"
                return 0
              fi
            done
            return 1
          }

          doona_tag=$(latest_release_tag Zakkaus/doona) || {
            echo "::error::no doona release found"
            exit 1
          }
          core_new=$(latest_green_commit daeuniverse/honk main) || {
            echo "::error::no upstream honk commit with a green CI"
            exit 1
          }
          require_sha "$core_new" core

          # The doona trigger is an immutable release tag. The honk trigger
          # is a commit, so the comparison is against the pinned commit: an
          # unchanged commit means the branch head is still the one that was
          # already built, and nothing is touched, which keeps the daily run
          # silent.
          if [ "$doona_tag" = "$DOONA_RELEASE" ] && [ "$core_new" = "$CORE_COMMIT" ]; then
            echo "No upstream change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          doona_new=$(gh api "repos/Zakkaus/doona/commits/$doona_tag" --jq .sha)
          require_sha "$doona_new" doona

          doona_version_new=$(curl -fsSL "https://raw.githubusercontent.com/Zakkaus/doona/$doona_new/package.json" | jq -r .version)
          if [ -z "$doona_version_new" ] || [ "$doona_version_new" = null ]; then
            echo "::error::cannot read doona version from package.json at $doona_new"
            exit 1
          fi

          changes=""
          if [ "$core_new" != "$CORE_COMMIT" ]; then
            changes="honk ${CORE_COMMIT:0:7}→${core_new:0:7}"
          fi
          if [ "$doona_tag" != "$DOONA_RELEASE" ]; then
            changes="${changes:+$changes, }doona ${DOONA_RELEASE}→${doona_tag}"
          fi

          {
            echo "changed=true"
            echo "core_new=$core_new"
            echo "doona_new=$doona_new"
            echo "doona_tag=$doona_tag"
            echo "doona_version_new=$doona_version_new"
            echo "changes=$changes"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.changed == 'true'
        with:
          node-version: '24'

      - name: Install Doona build tools
        if: steps.detect.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Stage new pins
        id: stage
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          . ci/pins.env
          core_new='${{ steps.detect.outputs.core_new }}'
          doona_new='${{ steps.detect.outputs.doona_new }}'
          doona_tag='${{ steps.detect.outputs.doona_tag }}'
          today=$(TZ=Asia/Shanghai date +%Y.%m.%d)

          bump_package() {
            file=$1
            old_version=$(sed -n 's/^PKG_VERSION:=//p' "$file")
            old_release=$(sed -n 's/^PKG_RELEASE:=//p' "$file")
            case "$old_release" in ''|*[!0-9]*) echo "::error::invalid release in $file"; exit 1 ;; esac
            if [ "$old_version" = "$today" ]; then
              new_release=$((old_release + 1))
            else
              new_release=1
            fi
            sed -i -e "s/^PKG_VERSION:=.*/PKG_VERSION:=$today/" \
              -e "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$new_release/" "$file"
          }

          sed -i \
            -e "s/^CORE_COMMIT=.*/CORE_COMMIT=$core_new/" \
            -e "s/^CORE_RELEASE=.*/CORE_RELEASE=$core_new/" \
            -e "s/^DOONA_COMMIT=.*/DOONA_COMMIT=$doona_new/" \
            -e "s/^DOONA_RELEASE=.*/DOONA_RELEASE=$doona_tag/" \
            -e "s/^DOONA_VERSION=.*/DOONA_VERSION=${{ steps.detect.outputs.doona_version_new }}/" \
            ci/pins.env
          if [ "$core_new" != "$CORE_COMMIT" ]; then
            sed -i "s/^CORE_COMMIT:=.*/CORE_COMMIT:=$core_new/" honk/Makefile
            bump_package honk/Makefile
          fi
          if [ "$doona_new" != "$DOONA_COMMIT" ]; then
            provisional="doona-$(printf '%s' "$doona_new" | cut -c1-8)-candidate.tar.gz"
            sed -i "s/^DOONA_ARCHIVE=.*/DOONA_ARCHIVE=$provisional/" ci/pins.env
            ci/build-doona.sh
            doona_hash=$(sha256sum "artifacts/cache/$provisional" | cut -d' ' -f1)
            doona_archive="doona-$(printf '%s' "$doona_new" | cut -c1-8)-$(printf '%s' "$doona_hash" | cut -c1-12).tar.gz"
            mv "artifacts/cache/$provisional" "artifacts/cache/$doona_archive"
            sed -i "s/^DOONA_ARCHIVE=.*/DOONA_ARCHIVE=$doona_archive/" ci/pins.env
            sed -i -e "s/^PKG_SOURCE:=.*/PKG_SOURCE:=$doona_archive/" \
              -e "s/^PKG_HASH:=.*/PKG_HASH:=$doona_hash/" luci-app-honk/Makefile
            bump_package luci-app-honk/Makefile
          fi
          bash scripts/check.sh

          git config user.name szwjp
          git config user.email szwjp@users.noreply.github.com
          git checkout -B "$STAGING"
          git add ci/pins.env honk/Makefile luci-app-honk/Makefile
          git commit -m "Update Honk upstream pins" \
            -m "改动：写入上游 pin，honk $(sed -n 's/^PKG_VERSION:=//p' honk/Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' honk/Makefile)，luci-app-honk $(sed -n 's/^PKG_VERSION:=//p' luci-app-honk/Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' luci-app-honk/Makefile)。" \
            -m "原因：将上游变更固定到可验证的候选包。"
          echo "staging_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Publish candidate branch and immutable Doona source
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ci/pins.env
          git -c credential.helper='!gh auth git-credential' \
            push origin "HEAD:refs/heads/$STAGING"
          if [ -s "artifacts/cache/$DOONA_ARCHIVE" ]; then
            gh release view staging >/dev/null 2>&1 || \
              gh release create staging --title 'staging assets' --prerelease --latest=false
            gh release upload staging "artifacts/cache/$DOONA_ARCHIVE" --clobber
          fi

      - name: Build, promote and verify full release
        id: verify
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN branch pushes do not trigger push workflows. This
          # dispatch builds all source assets and SDK packages before promotion.
          output=$(gh workflow run release.yml --ref "$STAGING" \
            -f auto_publish=true -f base_sha='${{ steps.stage.outputs.base_sha }}')
          run_id=$(printf '%s\n' "$output" | sed -nE 's|.*actions/runs/([0-9]+).*|\1|p' | tail -1)
          case "$run_id" in ''|*[!0-9]*) echo "::error::cannot read release run ID: $output"; exit 1 ;; esac
          expected_sha='${{ steps.stage.outputs.staging_sha }}'
          actual_sha=
          for _ in $(seq 1 60); do
            actual_sha=$(gh run view "$run_id" --json headSha --jq .headSha 2>/dev/null || true)
            [ -n "$actual_sha" ] && break
            sleep 2
          done
          [ "$actual_sha" = "$expected_sha" ] || {
            echo "::error::release run $run_id uses $actual_sha, expected $expected_sha"
            exit 1
          }
          result=
          for _ in $(seq 1 240); do
            result=$(gh run view "$run_id" --json status,conclusion --jq '.status + " " + (.conclusion // "")')
            if [ "${result%% *}" = completed ]; then
              [ "${result#* }" = success ] || { echo "::error::release run $run_id: $result"; exit 1; }
              break
            fi
            sleep 30
          done
          [ "${result%% *}" = completed ] || { echo "::error::release run $run_id timed out"; exit 1; }
          release_tag=$(gh release list --limit 100 --json tagName --jq ".[].tagName | select(endswith(\"-r$run_id\"))" | head -1)
          [ -n "$release_tag" ] || { echo "::error::formal release for run $run_id is missing"; exit 1; }
          test "$(gh release view "$release_tag" --json isPrerelease --jq .isPrerelease)" = false

          {
            echo "## Honk upstream update published"
            echo ""
            echo "Staging branch: \`$STAGING\`"
            echo "Validated commit: \`${{ steps.stage.outputs.staging_sha }}\`"
            echo "Formal release: \`$release_tag\`"
            echo ""
            echo "Doona, Honk core and all six package architectures passed; main, Release and R2 were updated."
          } >> "$GITHUB_STEP_SUMMARY"
