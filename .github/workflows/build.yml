name: Build Honk packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: Build pinned Doona interface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check package metadata and scripts
        run: bash scripts/check.sh
      - name: Build pinned Doona interface
        run: ci/build-doona.sh
      - name: Verify pinned Doona archive hash
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v7
        with:
          name: honk-source-build
          path: |
            artifacts/cache/*.tar.gz
            luci-app-honk/generated-doona-stage.mk
          if-no-files-found: error
          retention-days: 7

  core-build:
    name: Build honk-core (x86_64 smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # mlugg/setup-zig still targets the Node 20 runtime upstream and has no
      # Node 24 release, so install Zig from the official tarball instead.
      # The whole distribution directory has to go on PATH, not just the
      # binary: zig locates its bundled `lib/` relative to the executable and
      # aborts with "unable to find zig installation directory" otherwise.
      # Pinned version + SHA256 from ci/pins.env, same shape as the rclone
      # install; ci/build-core.sh re-asserts `zig version` against the pin.
      - name: Install Zig
        run: |
          set -euo pipefail
          source ci/pins.env
          dest="/opt/zig-${ZIG_VERSION}"
          curl -fsSL -o zig.tar.xz "$ZIG_URL"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          sudo mkdir -p "$dest"
          sudo tar -xJf zig.tar.xz -C "$dest" --strip-components=1
          # GITHUB_PATH only affects later steps; assert here so a broken
          # install fails in this step instead of deep inside cc-rs.
          test -d "$dest/lib" || { echo "zig lib/ missing from $dest" >&2; exit 1; }
          test "$("$dest/zig" version)" = "$ZIG_VERSION"
          echo "$dest" >> "$GITHUB_PATH"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep zstd
      - name: Build honk-core (x86_64)
        run: CORE_ARCHS=x86_64 ci/build-core.sh
      - uses: actions/upload-artifact@v7
        with:
          name: honk-core-x86_64
          path: artifacts/cache/honk-core-*.tar.gz
          if-no-files-found: error
          retention-days: 7
